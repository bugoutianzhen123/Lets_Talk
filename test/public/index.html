<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Chat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f1f1f1;
        }

        .container {
            width: 500px;
            margin: 20px auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
        }

        input,
        button {
            padding: 10px;
            width: 100%;
            margin: 10px 0;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .messages {
            max-height: 300px;
            overflow-y: scroll;
            border-bottom: 1px solid #ccc;
            margin-bottom: 20px;
            padding: 10px;
        }

        .message {
            margin: 5px 0;
        }

        .friends {
            margin-top: 20px;
        }

        .friend {
            cursor: pointer;
            padding: 5px;
            margin: 5px;
            background-color: #e0e0e0;
            border-radius: 4px;
        }

        .friend:hover {
            background-color: #d0d0d0;
        }
    </style>
</head>

<body>

    <div class="container" id="login-container">
        <div class="header">Login</div>
        <input type="text" id="username" placeholder="Username" />
        <input type="password" id="password" placeholder="Password" />
        <button id="login-btn">Login</button>
    </div>

    <div class="container" id="chat-container" style="display: none;">
        <div class="header">Chat</div>
        <div class="messages" id="messages"></div>
        <input type="text" id="message-input" placeholder="Type a message" />
        <button id="send-message-btn">Send</button>
        <div class="friends">
            <div class="friend" id="friend1">Friend 1</div>
            <div class="friend" id="friend2">Friend 2</div>
            <!-- Add more friends here -->
        </div>
    </div>

    <script src="https://cdn.socket.io/4.0.1/socket.io.min.js"></script>
    <script>
        const socket = io("http://localhost:4000");

        const loginContainer = document.getElementById("login-container");
        const chatContainer = document.getElementById("chat-container");
        const messagesDiv = document.getElementById("messages");
        const messageInput = document.getElementById("message-input");

        const loginBtn = document.getElementById("login-btn");
        const sendMessageBtn = document.getElementById("send-message-btn");

        let username = "";
        let token = "";

        // Handle login
        loginBtn.addEventListener("click", () => {
            username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            if (username && password) {
                fetch("http://localhost:4000/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ username, password })
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.token) {
                            token = data.token;
                            loginContainer.style.display = "none";
                            chatContainer.style.display = "block";
                            socket.emit("login", { username, token });
                        } else {
                            alert("Invalid login!");
                        }
                    });
            }
        });

        // Send a message
        sendMessageBtn.addEventListener("click", () => {
            const message = messageInput.value;
            if (message.trim()) {
                socket.emit("sendMessage", { message, username });
                messageInput.value = ""; // clear input
            }
        });

        // Listen for incoming messages
        socket.on("message", (msg) => {
            const messageDiv = document.createElement("div");
            messageDiv.classList.add("message");
            messageDiv.textContent = `${msg.username}: ${msg.message}`;
            messagesDiv.appendChild(messageDiv);
        });

        // Friend click event to send message
        const friends = document.querySelectorAll(".friend");
        friends.forEach(friend => {
            friend.addEventListener("click", () => {
                const friendUsername = friend.textContent;
                socket.emit("startPrivateChat", { username: friendUsername });
                alert(`Started private chat with ${friendUsername}`);
            });
        });
    </script>

</body>

</html>
